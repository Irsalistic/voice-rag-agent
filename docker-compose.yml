services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /app/data
      SERVE_FRONTEND: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      STT_PROVIDER: ${STT_PROVIDER:-auto}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-en-US-AriaNeural}
      FASTEMBED_CACHE_PATH: /opt/fastembed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - vesper-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vesper-data:
